<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i love studying · asset library</title>
  <meta name="description" content="Browse and download SVG and HTML files from CaptainCSS/i-love-studying-v7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <style>
    :root{font-family:Archivo,system-ui,sans-serif;color:#101522;background:#edf0f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#dce5ff,transparent 55%),#edf0f7}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{background:#fff;border-bottom:2px solid #101522}.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:17px;font-weight:900}.brand span{color:#2952ff}.btn,input{font:inherit}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:2px solid #101522;border-radius:7px;background:#fff;color:#101522;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 #101522}.btn:hover{transform:translate(-1px,-1px)}.btn.primary{background:#2952ff;color:#fff}.hero{padding:42px 0 34px;background:linear-gradient(130deg,#1e3dff,#4a68ff);color:white;border-bottom:2px solid #101522}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:0;font-weight:900;letter-spacing:-.04em}.hero p{margin:14px 0 0;color:#e5eaff}.toolbar{position:sticky;top:10px;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:#fff;border:2px solid #101522;border-radius:12px;box-shadow:4px 4px 0 #101522;margin-top:24px}.search{flex:1 1 240px}.search input{width:100%;height:42px;border:2px solid #101522;border-radius:7px;padding:0 12px;background:#f3f5fa}.count{margin:18px 0 12px;color:#556070;font-size:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{border:2px solid #101522;border-radius:99px;background:white;padding:7px 13px;font-weight:700;cursor:pointer}.chip[aria-pressed=true]{background:#101522;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:18px;padding-bottom:90px}.card{background:white;border:2px solid #101522;border-radius:12px;padding:12px;box-shadow:4px 4px 0 #101522;min-width:0}.preview{height:160px;border:2px solid #101522;border-radius:8px;background-color:#111722;background-image:linear-gradient(45deg,#1b2431 25%,transparent 25%,transparent 75%,#1b2431 75%),linear-gradient(45deg,#1b2431 25%,transparent 25%,transparent 75%,#1b2431 75%);background-size:14px 14px;background-position:0 0,7px 7px;display:grid;place-items:center;position:relative;overflow:hidden}.preview img{max-width:90%;max-height:90%;object-fit:contain}.preview .file-icon{font-size:44px;color:#9eb2ff}.type{position:absolute;left:7px;top:7px;border:1px solid #101522;border-radius:4px;background:white;padding:2px 6px;font:11px 'JetBrains Mono',monospace}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:13px 2px 3px}.path{font:11px 'JetBrains Mono',monospace;color:#8490a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 2px 12px}.actions{display:flex;gap:8px;border-top:1px dashed #cfd6e4;padding-top:10px}.actions .btn{flex:1;min-height:36px;font-size:13px}.state{background:white;border:2px dashed #101522;border-radius:10px;padding:40px 18px;text-align:center;margin:20px 0}.state h2{margin:0 0 8px}.state p{color:#556070}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101522;color:white;padding:11px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}.toast.show{opacity:1}footer{background:#101522;color:#c5ccda;padding:18px 0;font-size:13px}footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}dialog{border:2px solid #101522;border-radius:12px;width:min(420px,calc(100% - 28px));padding:22px}dialog input{width:100%;height:40px;margin:6px 0 12px;padding:0 10px;border:2px solid #101522;border-radius:6px}dialog::backdrop{background:#10152299}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}@media(max-width:600px){.hero{padding:34px 0}.toolbar{top:6px}.hide-mobile{display:none}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><div class="brand">i love studying <span>v7</span></div><a class="btn" id="repoLink" href="https://github.com/CaptainCSS/i-love-studying-v7" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i><span class="hide-mobile">Repository</span></a></div></header>
  <section class="hero"><div class="wrap"><h1>Asset library</h1><p>Browse and download SVG graphics and HTML files from the repository.</p></div></section>
  <main class="wrap">
    <div class="toolbar"><label class="search"><input id="search" type="search" placeholder="Search files or folders…" aria-label="Search files"></label><button class="btn" id="sourceBtn" type="button"><i class="fa-brands fa-github"></i><span class="hide-mobile">Source</span></button><button class="btn primary hidden" id="zipBtn" type="button"><i class="fa-solid fa-cloud-arrow-down"></i><span id="zipLabel">Download ZIP</span></button><button class="btn" id="refreshBtn" type="button" title="Refresh files" aria-label="Refresh files"><i class="fa-solid fa-rotate-right"></i></button></div>
    <div id="chips" class="chips hidden" aria-label="Filter by folder"></div><p id="status" class="count" aria-live="polite">Loading repository files…</p><div id="grid" class="grid"></div><div id="empty" class="state hidden"><h2 id="emptyTitle">No files found</h2><p id="emptyText"></p><button class="btn" id="clearBtn" type="button">Clear search and filters</button></div>
  </main>
  <footer><div class="wrap"><span>© captaincss · dsc.gg/ilovestudying</span><span>Source: <code id="sourceName">CaptainCSS/i-love-studying-v7</code></span></div></footer>
  <dialog id="sourceDialog"><form id="sourceForm"><h2>Change source</h2><label>Repository (owner/name or GitHub URL)<input id="repoInput" required placeholder="owner/repository"></label><label>Branch (optional)<input id="branchInput" placeholder="main"></label><div class="dialog-actions"><button class="btn" type="button" id="cancelBtn">Cancel</button><button class="btn primary" type="submit">Load files</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {owner:'CaptainCSS',repo:'i-love-studying-v7',branch:'',files:[],filtered:[],folder:'all',busy:false};
  try { const saved=JSON.parse(localStorage.getItem('svgSource')); if(saved?.owner&&saved?.repo) Object.assign(state,saved); } catch {}
  const esc = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rawUrl = (path,branch) => `https://raw.githubusercontent.com/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/${encodeURIComponent(branch)}/${path.split('/').map(encodeURIComponent).join('/')}`;
  const folderOf = path => path.includes('/') ? path.split('/')[0] : 'Root';
  let toastTimer;
  function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
  function updateSource(){ $('sourceName').textContent=`${state.owner}/${state.repo}`;$('repoLink').href=`https://github.com/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}`; }
  async function fetchFiles(){
    $('status').textContent='Loading repository files…';$('grid').innerHTML='';$('empty').classList.add('hidden');$('zipBtn').classList.add('hidden');updateSource();
    let found=null,used='';
    for(const branch of (state.branch?[state.branch]:['main','master'])){
      try{
        const response=await fetch(`https://api.github.com/repos/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
        if(!response.ok) throw Error(`GitHub returned ${response.status}`);
        const tree=await response.json();found=(tree.tree||[]).filter(item=>item.type==='blob'&&/\.(svg|html?)$/i.test(item.path)).map(item=>({path:item.path,name:item.path.split('/').pop(),folder:folderOf(item.path),type:/\.svg$/i.test(item.path)?'svg':'html',url:rawUrl(item.path,branch)}));used=branch;break;
      }catch(error){ if(state.branch) break; }
    }
    if(!found){state.files=[];$('status').textContent='';$('emptyTitle').textContent='Couldn’t load repository';$('emptyText').textContent=`Could not load ${state.owner}/${state.repo}. Check the repository name, branch, network connection, or GitHub API rate limit.`;$('empty').classList.remove('hidden');return;}
    state.branch=used;state.files=found.sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));state.folder='all';render();
  }
  function render(){
    const query=$('search').value.trim().toLowerCase();state.filtered=state.files.filter(file=>(state.folder==='all'||file.folder===state.folder)&&(!query||file.path.toLowerCase().includes(query)));
    const folders=[...new Set(state.files.map(file=>file.folder))].sort((a,b)=>a.localeCompare(b));
    $('chips').innerHTML=folders.length>1?['all',...folders].map(folder=>`<button class="chip" type="button" data-folder="${esc(folder)}" aria-pressed="${state.folder===folder}">${folder==='all'?'All':esc(folder)} <small>${folder==='all'?state.files.length:state.files.filter(f=>f.folder===folder).length}</small></button>`).join(''):'';
    $('chips').classList.toggle('hidden',folders.length<2);
    $('status').textContent=`Showing ${state.filtered.length} of ${state.files.length} files · ${state.files.filter(f=>f.type==='svg').length} SVG · ${state.files.filter(f=>f.type==='html').length} HTML`;
    $('zipBtn').classList.toggle('hidden',!state.filtered.length);$('zipLabel').textContent=`Download ZIP (${state.filtered.length})`;
    if(!state.filtered.length){$('grid').innerHTML='';$('emptyTitle').textContent='No files match';$('emptyText').textContent=state.files.length?'Try changing your search or folder filter.':`No SVG or HTML files found in ${state.owner}/${state.repo}.`;$('empty').classList.remove('hidden');return;}
    $('empty').classList.add('hidden');
    $('grid').innerHTML=state.filtered.map((file,index)=>`<article class="card"><div class="preview">${file.type==='svg'?`<img loading="lazy" src="${esc(file.url)}" alt="${esc(file.name)}" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'file-icon fa-regular fa-image'}))">`:'<i class="file-icon fa-brands fa-html5" aria-hidden="true"></i>'}<span class="type">${file.type.toUpperCase()}</span></div><h2 class="name" title="${esc(file.name)}">${esc(file.name)}</h2><p class="path" title="${esc(file.path)}">${esc(file.path)}</p><div class="actions"><button class="btn primary" type="button" data-download="${index}"><i class="fa-solid fa-download"></i> Download</button><a class="btn" href="${esc(file.url)}" target="_blank" rel="noopener noreferrer" title="Open raw file"><i class="fa-solid fa-arrow-up-right-from-square"></i></a></div></article>`).join('');
  }
  async function download(file){
    try{const response=await fetch(file.url);if(!response.ok)throw Error('Download request failed');const blob=await response.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=file.name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`Downloaded ${file.name}`)}
    catch{const link=document.createElement('a');link.href=file.url;link.download=file.name;link.target='_blank';link.rel='noopener';link.click();toast(`Opening ${file.name}`)}
  }
  $('grid').addEventListener('click',event=>{const button=event.target.closest('[data-download]');if(button){const file=state.filtered[Number(button.dataset.download)];if(file)download(file)}});
  $('chips').addEventListener('click',event=>{const button=event.target.closest('[data-folder]');if(button){state.folder=button.dataset.folder;render()}});
  $('search').addEventListener('input',render);$('refreshBtn').addEventListener('click',fetchFiles);$('clearBtn').addEventListener('click',()=>{$('search').value='';state.folder='all';render()});
  $('zipBtn').addEventListener('click',async()=>{if(state.busy||!state.filtered.length)return;if(state.filtered.length===1){download(state.filtered[0]);return}if(!window.JSZip){toast('ZIP library did not load');return}state.busy=true;$('zipBtn').disabled=true;try{const zip=new JSZip();for(let i=0;i<state.filtered.length;i++){const file=state.filtered[i];$('zipLabel').textContent=`Packing ${i+1}/${state.filtered.length}`;const response=await fetch(file.url);if(!response.ok)throw Error(`Could not fetch ${file.path}`);zip.file(file.path,await response.blob())}const blob=await zip.generateAsync({type:'blob'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`${state.repo}-files.zip`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('ZIP downloaded')}catch(error){console.error(error);toast('Could not create ZIP; try downloading files individually')}finally{state.busy=false;$('zipBtn').disabled=false;$('zipLabel').textContent=`Download ZIP (${state.filtered.length})`}});
  const dialog=$('sourceDialog');$('sourceBtn').addEventListener('click',()=>{$('repoInput').value=`${state.owner}/${state.repo}`;$('branchInput').value=state.branch;dialog.showModal()});$('cancelBtn').addEventListener('click',()=>dialog.close());
  $('sourceForm').addEventListener('submit',event=>{event.preventDefault();const text=$('repoInput').value.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/i,'').split('/').filter(Boolean);if(text.length<2){toast('Enter a repository as owner/name');return}state.owner=text[0];state.repo=text[1];state.branch=$('branchInput').value.trim();try{localStorage.setItem('svgSource',JSON.stringify({owner:state.owner,repo:state.repo,branch:state.branch}))}catch{}dialog.close();fetchFiles()});
  fetchFiles();
})();
</script>
</body>
</html>
