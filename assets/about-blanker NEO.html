<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
      overflow: hidden;
      position: relative;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    input[type="url"] {
      width: 300px;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4285F4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #357ae8;
    }

    .retry-note {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
      font-style: italic;
    }

    /* === SHARED BACKGROUND STYLES === */
    .bg-layer {
      position: absolute;
      top: 0;
      height: 100%;
      z-index: 1;
      opacity: 0.15;
      color: #333;
      overflow: hidden;
      pointer-events: none;
    }

    /* Left Side Code */
    .code-background-container {
      left: 0;
      width: 50%;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    /* Right Side Watermark */
    .watermark-background-container {
      right: 0;
      width: 50%;
      text-align: right;
      padding-right: 20px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 4vw;
      display: flex;
      flex-direction: column;
    }

    .scroll-content {
      display: flex;
      flex-direction: column;
      animation: scroll-up 40s linear infinite;
    }

    @keyframes scroll-up {
      0% { transform: translateY(0%); }
      100% { transform: translateY(-50%); }
    }
  </style>
</head>
<body>

  <div class="bg-layer code-background-container">
    <div id="codeScrollElement" class="scroll-content"></div>
  </div>

  <div class="bg-layer watermark-background-container">
    <div id="watermarkScrollElement" class="scroll-content"></div>
  </div>

  <div class="container">
    <h2>about:blanker NEO!</h2>
    <input type="url" id="urlInput" placeholder="https://example.com" required>
    <br>
    <button id="openBtn">Open in about:blank</button>
    <p class="retry-note">If it still gets blocked, click anywhere inside the window.</p>
  </div>

  <script>
    /* === SETUP BACKGROUNDS === */
    const rawCodeText = `function loadInBlank() {
  let url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }
}
<iframe src="url" allow="fullscreen" allowfullscreen></iframe>`;

    const codeContainer = document.getElementById('codeScrollElement');
    let fullCode = '';
    for (let i = 0; i < 20; i++) {
      fullCode += rawCodeText + '\n-------------------------\n';
    }
    // Safely set text content first, then duplicate for seamless animation loop
    codeContainer.textContent = fullCode;
    codeContainer.textContent += fullCode;

    const watermarkContainer = document.getElementById('watermarkScrollElement');
    const watermarkText = "about:blanker NEO<br>by captaincss<br><br>";
    let fullWatermark = '';
    for (let i = 0; i < 25; i++) {
      fullWatermark += watermarkText;
    }
    watermarkContainer.innerHTML = fullWatermark + fullWatermark;

    /* === CORE FUNCTIONALITY === */
    document.getElementById('openBtn').addEventListener('click', loadInBlank);
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') loadInBlank();
    });

    function loadInBlank() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      // Open window immediately within user interaction context
      const win = window.open('about:blank', '_blank');
      
      if (!win || win.closed || typeof win.closed === 'undefined') {
        alert("Pop-up blocked! Please allow pop-ups for this site in your browser settings.");
        return;
      }

      const injectedHtml = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/selfhst/icons/png/instructure-canvas.png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f0f0f0; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe src="${url}" allow="fullscreen" allowfullscreen></iframe>
    <script>
        window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
    <\/script>
</body>
</html>`;

      win.document.open();
      win.document.write(injectedHtml);
      win.document.close();

      document.getElementById('urlInput').value = '';
    }
  </script>
</body>
</html>
